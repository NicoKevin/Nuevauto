[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nuevauto-scraper"
version = "0.1.0"
description = "Système de veille d'annonces automobiles — collecteur + ETL"
requires-python = ">=3.12"
dependencies = [
    # HTTP client asynchrone — léger et rapide pour scraping
    "httpx[http2]>=0.27.0",
    # Parsing HTML
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",           # Parser HTML plus rapide que html.parser
    # Client Supabase officiel (Python)
    "supabase>=2.5.0",
    # Utilitaires
    "python-dotenv>=1.0.0",  # Chargement .env en local
    "pydantic>=2.7.0",       # Validation des données scrapées
    "tenacity>=8.3.0",       # Retry automatique en cas d'erreur réseau
    "structlog>=24.2.0",     # Logging structuré (JSON) pour CI/CD
]

[project.optional-dependencies]
playwright = [
    # Optionnel — seulement si un site nécessite du JS
    "playwright>=1.44.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx[mock]>=0.27.0",
    "ruff>=0.4.0",           # Linter + formatter
]

[tool.hatch.build.targets.wheel]
packages = ["collectors", "etl", "notifications", "db"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
