name: 💓 Keepalive Supabase

on:
  # Toutes les 3 jours à 6h00 UTC — empêche la mise en pause du projet Supabase Free
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:

jobs:
  keepalive:
    name: Heartbeat Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "scraper/pyproject.toml"

      - name: 📦 Installation des dépendances
        run: |
          cd scraper
          pip install -e .

      - name: 💓 Heartbeat
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd scraper
          python main.py --heartbeat

      - name: 📝 Log
        if: always()
        run: |
          echo "## Keepalive Supabase" >> $GITHUB_STEP_SUMMARY
          echo "- Date: $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- Statut: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
