name: 🚗 Scraper Annonces

on:
  # Exécution planifiée : 2 fois par jour (8h00 et 18h00 UTC = 10h et 20h Paris)
  schedule:
    - cron: "0 8 * * *"   # 10h00 heure Paris (UTC+2)
    - cron: "0 16 * * *"  # 18h00 heure Paris (UTC+2)
  # Déclenchement manuel depuis l'interface GitHub Actions (pour tests)
  workflow_dispatch:
    inputs:
      source:
        description: "Source à scraper (laisser vide pour toutes)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - leboncoin
          - lacentrale
      dry_run:
        description: "Dry run (scrape sans écrire en base)"
        required: false
        default: false
        type: boolean

jobs:
  scrape:
    name: Collecte des annonces
    runs-on: ubuntu-latest
    timeout-minutes: 30   # Sécurité : tue le job s'il tourne plus de 30 min

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "scraper/pyproject.toml"

      - name: 📦 Installation des dépendances
        run: |
          cd scraper
          pip install -e ".[dev]"

      - name: ✅ Tests anti-PII (bloquants)
        run: |
          cd scraper
          python -m pytest tests/test_no_pii.py -v --tb=short
        # Ce step est bloquant : si les tests échouent, le scraper ne tourne pas

      - name: 🔍 Linting (non bloquant)
        run: |
          cd scraper
          python -m ruff check . --output-format=github || true

      - name: 🚗 Lancement du scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          cd scraper
          SOURCE_ARG=""
          if [ -n "${{ github.event.inputs.source }}" ]; then
            SOURCE_ARG="--source ${{ github.event.inputs.source }}"
          fi
          DRY_RUN_ARG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_ARG="--dry-run"
          fi
          python main.py $SOURCE_ARG $DRY_RUN_ARG

      - name: 📊 Résumé du run
        if: always()
        run: |
          echo "## Résultats du scraper" >> $GITHUB_STEP_SUMMARY
          echo "- Date: $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- Source: ${{ github.event.inputs.source || 'toutes' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Dry run: ${{ github.event.inputs.dry_run || 'false' }}" >> $GITHUB_STEP_SUMMARY
